<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">P02 三端 Top4 证据条</title><desc id="desc">来源、批局与收批县的 Top4 横向条形图，条长与记录量成正比。</desc>
<style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#30383A}.caps{font-size:12px;letter-spacing:1.8px;fill:#A9A298}.title{font-size:26px;font-weight:700}.label{font-size:16px;font-weight:700}.value{font-size:12px;fill:#A9A298}.note{font-size:11px;fill:#A9A298}.axis{font-size:10px;fill:#A9A298}.hair{vector-effect:non-scaling-stroke}</style><rect id="background" width="900" height="500" fill="#F7F3EB"/><text class="caps" x="38" y="16">EVIDENCE BARS / 三端证据</text><g id="source-top4"><text class="caps" x="38" y="38">来源国家 TOP 4</text><line x1="38" x2="720" y1="50" y2="50" stroke="#C7D2D1"/><g id="source-top4-0"><circle cx="38" cy="66" r="5" fill="#91A6AA" fill-opacity=".9"/><text class="label" x="56" y="70">泰国</text><rect x="190" y="56" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="56" width="360.0" height="9" rx="4.5" fill="#91A6AA" fill-opacity=".9"/><text class="value" x="580" y="70">24,245</text></g><g id="source-top4-1"><circle cx="38" cy="89" r="5" fill="#91A6AA" fill-opacity=".9"/><text class="label" x="56" y="93">新加坡</text><rect x="190" y="79" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="79" width="275.4" height="9" rx="4.5" fill="#91A6AA" fill-opacity=".9"/><text class="value" x="580" y="93">18,549</text></g><g id="source-top4-2"><circle cx="38" cy="112" r="5" fill="#91A6AA" fill-opacity=".9"/><text class="label" x="56" y="116">马来西亚</text><rect x="190" y="102" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="102" width="77.3" height="9" rx="4.5" fill="#91A6AA" fill-opacity=".9"/><text class="value" x="580" y="116">5,204</text></g><g id="source-top4-3"><circle cx="38" cy="135" r="5" fill="#91A6AA" fill-opacity=".9"/><text class="label" x="56" y="139">香港</text><rect x="190" y="125" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="125" width="11.7" height="9" rx="4.5" fill="#91A6AA" fill-opacity=".9"/><text class="value" x="580" y="139">786</text></g></g><g id="office-top4"><text class="caps" x="38" y="194">经手批局 TOP 4</text><line x1="38" x2="720" y1="206" y2="206" stroke="#C7D2D1"/><g id="office-top4-0"><circle cx="38" cy="222" r="5" fill="#A9A298" fill-opacity=".9"/><text class="label" x="56" y="226">未记录批局</text><rect x="190" y="212" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="212" width="360.0" height="9" rx="4.5" fill="#A9A298" fill-opacity=".9"/><text class="value" x="580" y="226">25,374</text></g><g id="office-top4-1"><circle cx="38" cy="245" r="5" fill="#A9A298" fill-opacity=".9"/><text class="label" x="56" y="249">其他批局</text><rect x="190" y="235" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="235" width="186.3" height="9" rx="4.5" fill="#A9A298" fill-opacity=".9"/><text class="value" x="580" y="249">13,133</text></g><g id="office-top4-2"><circle cx="38" cy="268" r="5" fill="#A9A298" fill-opacity=".9"/><text class="label" x="56" y="272">万益成</text><rect x="190" y="258" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="258" width="22.2" height="9" rx="4.5" fill="#A9A298" fill-opacity=".9"/><text class="value" x="580" y="272">1,568</text></g><g id="office-top4-3"><circle cx="38" cy="291" r="5" fill="#A9A298" fill-opacity=".9"/><text class="label" x="56" y="295">祥泰隆</text><rect x="190" y="281" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="281" width="19.1" height="9" rx="4.5" fill="#A9A298" fill-opacity=".9"/><text class="value" x="580" y="295">1,349</text></g></g><g id="county-top4"><text class="caps" x="38" y="350">收批县 TOP 4</text><line x1="38" x2="720" y1="362" y2="362" stroke="#C7D2D1"/><g id="county-top4-0"><circle cx="38" cy="378" r="5" fill="#C86556" fill-opacity=".9"/><text class="label" x="56" y="382">潮安</text><rect x="190" y="368" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="368" width="360.0" height="9" rx="4.5" fill="#C86556" fill-opacity=".9"/><text class="value" x="580" y="382">27,258</text></g><g id="county-top4-1"><circle cx="38" cy="401" r="5" fill="#C86556" fill-opacity=".9"/><text class="label" x="56" y="405">澄海</text><rect x="190" y="391" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="391" width="220.7" height="9" rx="4.5" fill="#C86556" fill-opacity=".9"/><text class="value" x="580" y="405">16,709</text></g><g id="county-top4-2"><circle cx="38" cy="424" r="5" fill="#C86556" fill-opacity=".9"/><text class="label" x="56" y="428">揭阳</text><rect x="190" y="414" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="414" width="20.4" height="9" rx="4.5" fill="#C86556" fill-opacity=".9"/><text class="value" x="580" y="428">1,548</text></g><g id="county-top4-3"><circle cx="38" cy="447" r="5" fill="#C86556" fill-opacity=".9"/><text class="label" x="56" y="451">饶平</text><rect x="190" y="437" width="360" height="9" rx="4.5" fill="#D7D0C6"/><rect x="190" y="437" width="19.0" height="9" rx="4.5" fill="#C86556" fill-opacity=".9"/><text class="value" x="580" y="451">1,441</text></g></g><text class="note" x="38" y="490">条长 ∝ 记录量；与主图端线共用同一计数口径。未记录与其他保留为字段边界。</text></svg>